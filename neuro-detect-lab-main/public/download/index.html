<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telechargement APK | NeuroDetect Lab</title>
    <style>
      :root {
        color-scheme: light;
        --bg: linear-gradient(180deg, #f7fbff 0%, #eaf3ff 50%, #ffffff 100%);
        --panel: rgba(255, 255, 255, 0.9);
        --text: #0f172a;
        --muted: #475569;
        --primary: #2563eb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .card {
        width: min(100%, 680px);
        border-radius: 28px;
        background: var(--panel);
        padding: 32px;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
        border: 1px solid rgba(148, 163, 184, 0.24);
      }
      h1 { margin: 0 0 12px; font-size: clamp(2rem, 4vw, 2.8rem); }
      p { color: var(--muted); line-height: 1.6; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 14px 22px;
        font-weight: 700;
        text-decoration: none;
      }
      .primary { background: var(--primary); color: white; }
      .secondary { background: #e2e8f0; color: var(--text); }
      code {
        display: inline-block;
        margin-top: 4px;
        padding: 6px 10px;
        border-radius: 12px;
        background: #eff6ff;
        color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>APK Android</h1>
      <p>
        Cette page est deja prete pour heberger l'application Android de NeuroDetect Lab. Une fois l'APK genere,
        placez le fichier dans ce dossier avec le nom <strong>app-release.apk</strong>.
      </p>
      <p>
        Lien final attendu:
        <br />
        <code>/download/app-release.apk</code>
      </p>
      <div class="actions">
        <a class="button primary" href="./app-release.apk">Telecharger l'APK</a>
        <a class="button secondary" href="../">Retour au site</a>
      </div>
    </main>
  </body>
</html>
